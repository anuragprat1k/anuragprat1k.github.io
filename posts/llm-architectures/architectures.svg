  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="135" y="32" text-anchor="middle" font-size="14" font-weight="600">GPT-2</text>
  <text x="135" y="50" text-anchor="middle" font-size="12" class="sub">2019</text>
  <text x="340" y="32" text-anchor="middle" font-size="14" font-weight="600">Llama-2</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" class="sub">2023</text>
  <text x="545" y="32" text-anchor="middle" font-size="14" font-weight="600">Mixtral</text>
  <text x="545" y="50" text-anchor="middle" font-size="12" class="sub">2023</text>

  <rect x="40" y="80" width="190" height="44" rx="8" class="n-fill n-stroke" stroke-width="1"/>
  <text x="135" y="106" text-anchor="middle" font-size="14" font-weight="500" class="n-label">LayerNorm</text>
  <line x1="135" y1="124" x2="135" y2="146" class="line" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="40" y="148" width="190" height="56" rx="8" class="n-fill n-stroke" stroke-width="1"/>
  <text x="135" y="170" text-anchor="middle" font-size="14" font-weight="500" class="n-label">Multi-head attention</text>
  <text x="135" y="190" text-anchor="middle" font-size="12" class="n-sub">Full causal, learned pos.</text>
  <line x1="135" y1="204" x2="135" y2="226" class="line" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="40" y="228" width="190" height="44" rx="8" class="n-fill n-stroke" stroke-width="1"/>
  <text x="135" y="254" text-anchor="middle" font-size="14" font-weight="500" class="n-label">LayerNorm</text>
  <line x1="135" y1="272" x2="135" y2="294" class="line" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="40" y="296" width="190" height="56" rx="8" class="n-fill n-stroke" stroke-width="1"/>
  <text x="135" y="318" text-anchor="middle" font-size="14" font-weight="500" class="n-label">GELU MLP</text>
  <text x="135" y="338" text-anchor="middle" font-size="12" class="n-sub">4·d hidden</text>

  <rect x="245" y="80" width="190" height="44" rx="8" class="g-fill g-stroke" stroke-width="1"/>
  <text x="340" y="106" text-anchor="middle" font-size="14" font-weight="500" class="g-label">RMSNorm</text>
  <line x1="340" y1="124" x2="340" y2="146" class="line" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="245" y="148" width="190" height="56" rx="8" class="g-fill g-stroke" stroke-width="1"/>
  <text x="340" y="170" text-anchor="middle" font-size="14" font-weight="500" class="g-label">Grouped-query attn</text>
  <text x="340" y="190" text-anchor="middle" font-size="12" class="g-sub">With RoPE on q, k</text>
  <line x1="340" y1="204" x2="340" y2="226" class="line" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="245" y="228" width="190" height="44" rx="8" class="g-fill g-stroke" stroke-width="1"/>
  <text x="340" y="254" text-anchor="middle" font-size="14" font-weight="500" class="g-label">RMSNorm</text>
  <line x1="340" y1="272" x2="340" y2="294" class="line" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="245" y="296" width="190" height="56" rx="8" class="g-fill g-stroke" stroke-width="1"/>
  <text x="340" y="318" text-anchor="middle" font-size="14" font-weight="500" class="g-label">SwiGLU MLP</text>
  <text x="340" y="338" text-anchor="middle" font-size="12" class="g-sub">8/3·d hidden, gated</text>

  <rect x="450" y="80" width="190" height="44" rx="8" class="n-fill n-stroke" stroke-width="1"/>
  <text x="545" y="106" text-anchor="middle" font-size="14" font-weight="500" class="n-label">RMSNorm</text>
  <line x1="545" y1="124" x2="545" y2="146" class="line" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="450" y="148" width="190" height="56" rx="8" class="n-fill n-stroke" stroke-width="1"/>
  <text x="545" y="170" text-anchor="middle" font-size="14" font-weight="500" class="n-label">Grouped-query attn</text>
  <text x="545" y="190" text-anchor="middle" font-size="12" class="n-sub">With RoPE on q, k</text>
  <line x1="545" y1="204" x2="545" y2="226" class="line" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="450" y="228" width="190" height="44" rx="8" class="n-fill n-stroke" stroke-width="1"/>
  <text x="545" y="254" text-anchor="middle" font-size="14" font-weight="500" class="n-label">RMSNorm</text>
  <line x1="545" y1="272" x2="545" y2="294" class="line" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="450" y="296" width="190" height="56" rx="8" class="v-fill v-stroke" stroke-width="1"/>
  <text x="545" y="318" text-anchor="middle" font-size="14" font-weight="500" class="v-label">Sparse MoE</text>
  <text x="545" y="338" text-anchor="middle" font-size="12" class="v-sub">Top-2 of N experts</text>

  <g transform="translate(40, 386)">
    <rect x="0" y="0" width="14" height="14" rx="3" class="n-fill n-stroke" stroke-width="1"/>
    <text x="22" y="11" font-size="12" class="sub">Baseline / carried over</text>
    <rect x="200" y="0" width="14" height="14" rx="3" class="g-fill g-stroke" stroke-width="1"/>
    <text x="222" y="11" font-size="12" class="sub">Changed in Llama-2</text>
    <rect x="380" y="0" width="14" height="14" rx="3" class="v-fill v-stroke" stroke-width="1"/>
    <text x="402" y="11" font-size="12" class="sub">Changed in Mixtral</text>
  </g>
</svg>
