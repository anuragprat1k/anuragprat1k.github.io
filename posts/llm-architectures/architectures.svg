    :root[data-theme="dark"] .arch-svg .g-label { fill: #a7f3d0; }
    :root[data-theme="dark"] .arch-svg .g-sub { fill: #6ee7b7; }
    :root[data-theme="dark"] .arch-svg .v-fill { fill: #4c1d95; }
    :root[data-theme="dark"] .arch-svg .v-stroke { stroke: #8b5cf6; }
    :root[data-theme="dark"] .arch-svg .v-label { fill: #ddd6fe; }
    :root[data-theme="dark"] .arch-svg .v-sub { fill: #c4b5fd; }

    :root[data-theme="light"] .arch-svg text { fill: #27272a; }
    :root[data-theme="light"] .arch-svg .sub { fill: #52525b; }
    :root[data-theme="light"] .arch-svg .line { stroke: #71717a; }
    :root[data-theme="light"] .arch-svg .n-fill { fill: #f4f4f5; }
    :root[data-theme="light"] .arch-svg .n-stroke { stroke: #a1a1aa; }
    :root[data-theme="light"] .arch-svg .n-label { fill: #27272a; }
    :root[data-theme="light"] .arch-svg .n-sub { fill: #52525b; }
    :root[data-theme="light"] .arch-svg .g-fill { fill: #d1fae5; }
    :root[data-theme="light"] .arch-svg .g-stroke { stroke: #059669; }
    :root[data-theme="light"] .arch-svg .g-label { fill: #065f46; }
    :root[data-theme="light"] .arch-svg .g-sub { fill: #047857; }
    :root[data-theme="light"] .arch-svg .v-fill { fill: #ede9fe; }
