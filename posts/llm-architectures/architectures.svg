<svg viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg" class="arch-svg" style="width:100%;height:auto;max-width:760px;display:block;margin:1.5em auto;font-family:-apple-system,'system-ui','Segoe UI',sans-serif">
  <title>Architectural progression: GPT-2 to Llama-2 to Mixtral transformer blocks</title>
  <desc>Three transformer blocks side by side. GPT-2 uses LayerNorm, multi-head attention, LayerNorm, and a GELU MLP. Llama-2 replaces all four with RMSNorm, grouped-query attention with RoPE, RMSNorm, and a SwiGLU MLP. Mixtral keeps Llama-2's norm and attention but swaps the MLP for a sparse mixture-of-experts layer.</desc>
  <style>
    .arch-svg text { fill: #27272a; }
    .arch-svg .sub { fill: #52525b; }
    .arch-svg .line { stroke: #71717a; }
    .arch-svg .n-fill { fill: #f4f4f5; }
    .arch-svg .n-stroke { stroke: #a1a1aa; }
    .arch-svg .n-label { fill: #27272a; }
    .arch-svg .n-sub { fill: #52525b; }
    .arch-svg .g-fill { fill: #d1fae5; }
    .arch-svg .g-stroke { stroke: #059669; }
    .arch-svg .g-label { fill: #065f46; }
    .arch-svg .g-sub { fill: #047857; }
    .arch-svg .v-fill { fill: #ede9fe; }
    .arch-svg .v-stroke { stroke: #6d28d9; }
    .arch-svg .v-label { fill: #5b21b6; }
    .arch-svg .v-sub { fill: #6d28d9; }

    @media (prefers-color-scheme: dark) {
      .arch-svg text { fill: #f4f4f5; }
      .arch-svg .sub { fill: #a1a1aa; }
      .arch-svg .line { stroke: #a1a1aa; }
      .arch-svg .n-fill { fill: #27272a; }
      .arch-svg .n-stroke { stroke: #71717a; }
      .arch-svg .n-label { fill: #f4f4f5; }
      .arch-svg .n-sub { fill: #a1a1aa; }
      .arch-svg .g-fill { fill: #064e3b; }
      .arch-svg .g-stroke { stroke: #10b981; }
      .arch-svg .g-label { fill: #a7f3d0; }
      .arch-svg .g-sub { fill: #6ee7b7; }
      .arch-svg .v-fill { fill: #4c1d95; }
      .arch-svg .v-stroke { stroke: #8b5cf6; }
      .arch-svg .v-label { fill: #ddd6fe; }
      .arch-svg .v-sub { fill: #c4b5fd; }
    }

    :root[data-theme="dark"] .arch-svg text { fill: #f4f4f5; }
    :root[data-theme="dark"] .arch-svg .sub { fill: #a1a1aa; }
    :root[data-theme="dark"] .arch-svg .line { stroke: #a1a1aa; }
    :root[data-theme="dark"] .arch-svg .n-fill { fill: #27272a; }
    :root[data-theme="dark"] .arch-svg .n-stroke { stroke: #71717a; }
    :root[data-theme="dark"] .arch-svg .n-label { fill: #f4f4f5; }
    :root[data-theme="dark"] .arch-svg .n-sub { fill: #a1a1aa; }
