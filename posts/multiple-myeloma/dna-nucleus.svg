<svg class="gene-diagram" viewBox="0 0 1120 600" role="img" aria-label="Left, Form — the blueprint: DNA letters group into codons, then a gene, then a chromosome, and all 46 chromosomes sit in the nucleus. Right, Function — the workers: a gene is transcribed into mRNA, a ribosome translates it into a chain of amino acids, which folds into a protein — different shapes for different jobs: enzyme, antibody, receptor, haemoglobin." style="width:100%;max-width:980px;height:auto;display:block;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <style>
    .gene-diagram{
      --heading:#1a1a1a; --label:#555; --boxtext:#1f2d3d;
      --blue-f:#e8f0fe; --blue-s:#6b9be8;
      --green-f:#e6f4ea; --green-s:#5cb87a;
      --purple-f:#ece9fb; --purple-s:#9184de;
      --red-f:#fdecea; --red-s:#d0654a;
      --mrna-f:#e0f2f1; --mrna-s:#3fb0a6;
      --rib-f:#eceff1; --rib-s:#8b97a3;
      --arrow:#b0b0b0; --divider:#dddddd;
    }
    :root[data-theme="dark"] .gene-diagram{
      --heading:#ececec; --label:#b3b3b3; --boxtext:#dbe6f5;
      --blue-f:#24425f; --blue-s:#6b9be8;
      --green-f:#234d34; --green-s:#5cb87a;
      --purple-f:#33305c; --purple-s:#9184de;
      --red-f:#4a2b25; --red-s:#e08767;
      --mrna-f:#173d3a; --mrna-s:#4db6ac;
      --rib-f:#333b43; --rib-s:#9aa7b2;
      --arrow:#777777; --divider:#444444;
    }
    @media (prefers-color-scheme: dark){
      :root[data-theme="auto"] .gene-diagram{
        --heading:#ececec; --label:#b3b3b3; --boxtext:#dbe6f5;
        --blue-f:#24425f; --blue-s:#6b9be8;
        --green-f:#234d34; --green-s:#5cb87a;
        --purple-f:#33305c; --purple-s:#9184de;
        --red-f:#4a2b25; --red-s:#e08767;
        --mrna-f:#173d3a; --mrna-s:#4db6ac;
        --rib-f:#333b43; --rib-s:#9aa7b2;
        --arrow:#777777; --divider:#444444;
      }
    }
    .gene-diagram text{font-size:16px;}
    .gene-diagram .h{fill:var(--heading);font-size:20px;font-weight:700;}
    .gene-diagram .l{fill:var(--label);}
    .gene-diagram .sub{fill:var(--label);font-size:13px;opacity:0.8;}
    .gene-diagram .bt{fill:var(--boxtext);}
    .gene-diagram .blue{fill:var(--blue-f);stroke:var(--blue-s);stroke-width:1.5;}
    .gene-diagram .green{fill:var(--green-f);stroke:var(--green-s);stroke-width:1.5;}
    .gene-diagram .purple{fill:var(--purple-f);stroke:var(--purple-s);stroke-width:1.5;}
    .gene-diagram .red{fill:var(--red-f);stroke:var(--red-s);stroke-width:1.5;}
    .gene-diagram .mrna{fill:var(--mrna-f);stroke:var(--mrna-s);stroke-width:1.5;}
    .gene-diagram .rib{fill:var(--rib-f);stroke:var(--rib-s);stroke-width:1.5;}
    .gene-diagram .arrow{stroke:var(--arrow);stroke-width:1.5;fill:none;}
    .gene-diagram .ahead{fill:var(--arrow);}
    .gene-diagram .divider{stroke:var(--divider);stroke-width:1;}
    .gene-diagram .nuc{fill:var(--blue-f);stroke:var(--blue-s);stroke-width:2;}
    .gene-diagram .chr{fill:var(--blue-s);}
    .gene-diagram .pstroke{stroke:var(--red-s);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .gene-diagram .memb{stroke:var(--rib-s);stroke-width:2;fill:none;}
  </style>
  <text class="h" x="40" y="40">Form — the blueprint</text>
  <text class="h" x="600" y="40">Function — the workers</text>
  <line class="divider" x1="560" y1="58" x2="560" y2="582"/>
  <text class="l" x="40" y="110" dominant-baseline="middle">Letters</text>
  <g>
    <rect class="blue" x="183" y="93" width="36" height="34" rx="6"/><text class="bt" x="201" y="110" text-anchor="middle" dominant-baseline="middle">A</text>
    <rect class="blue" x="225" y="93" width="36" height="34" rx="6"/><text class="bt" x="243" y="110" text-anchor="middle" dominant-baseline="middle">T</text>
    <rect class="blue" x="267" y="93" width="36" height="34" rx="6"/><text class="bt" x="285" y="110" text-anchor="middle" dominant-baseline="middle">G</text>
    <rect class="blue" x="325" y="93" width="36" height="34" rx="6"/><text class="bt" x="343" y="110" text-anchor="middle" dominant-baseline="middle">G</text>
    <rect class="blue" x="367" y="93" width="36" height="34" rx="6"/><text class="bt" x="385" y="110" text-anchor="middle" dominant-baseline="middle">C</text>
    <rect class="blue" x="409" y="93" width="36" height="34" rx="6"/><text class="bt" x="427" y="110" text-anchor="middle" dominant-baseline="middle">T</text>
  </g>
  <line class="arrow" x1="311" y1="128" x2="311" y2="155"/><polygon class="ahead" points="306,155 316,155 311,164"/>
  <text class="l" x="40" y="175" dominant-baseline="middle">Codon</text>
  <rect class="green" x="183" y="158" width="120" height="34" rx="8"/><text class="bt" x="243" y="175" text-anchor="middle" dominant-baseline="middle">3 letters</text>
  <rect class="green" x="321" y="158" width="120" height="34" rx="8"/><text class="bt" x="381" y="175" text-anchor="middle" dominant-baseline="middle">3 letters</text>
  <line class="arrow" x1="311" y1="193" x2="311" y2="220"/><polygon class="ahead" points="306,220 316,220 311,229"/>
  <text class="l" x="40" y="240" dominant-baseline="middle">Gene</text>
  <rect class="purple" x="183" y="223" width="258" height="34" rx="8"/><text class="bt" x="312" y="240" text-anchor="middle" dominant-baseline="middle">one gene = one protein</text>
  <line class="arrow" x1="443" y1="240" x2="711" y2="240"/><polygon class="ahead" points="711,235 711,245 720,240"/>
  <text class="sub" x="500" y="230" text-anchor="middle">transcription</text>
  <line class="arrow" x1="311" y1="258" x2="311" y2="281"/><polygon class="ahead" points="306,281 316,281 311,290"/>
  <text class="l" x="40" y="320" dominant-baseline="middle">Chromosome</text>
  <rect class="blue" x="291" y="285" width="40" height="85" rx="20"/>
  <text class="l" x="345" y="313" dominant-baseline="middle">one long DNA strand,</text>
  <text class="l" x="345" y="333" dominant-baseline="middle">packed with many genes</text>
